services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aashana_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPass123!
    # Mapped to host port 1434 to avoid conflict with mssql-erp (running on 1433)
    ports:
      - "1434:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPass123!' -Q 'SELECT 1' -No -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    image: aashana_web
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aashana_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5000
      - ActiveConnection=DockerSqlConnection
      - ConnectionStrings__DockerSqlConnection=Server=db,1433;Database=AashanaFashionDb;User Id=sa;Password=YourStrongPass123!;TrustServerCertificate=True;MultipleActiveResultSets=true
    ports:
      - "5000:5000"
    volumes:
      - dataprotection_keys:/app/dataprotection-keys
    restart: always

volumes:
  mssql_data:
  dataprotection_keys: